
<!DOCTYPE html>
<html>
<head>
    <title>OmniSight Demo Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Welcome Back</h2>

        <p>Login to your account</p>

        <input type="email" placeholder="Email Address">

        <input type="password" placeholder="Password">

        <button id="signin-btn" onclick="login()">
            Login
        </button>

        <p id="message"></p>

    </div>

    <script>
        function login() {
            document.getElementById("message").innerText =
                "Login button clicked successfully!";
        }
    </script>

</body>
</html>
