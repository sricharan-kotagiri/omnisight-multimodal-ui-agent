<!DOCTYPE html>
<html>
<head>
    <title>OmniSight Vision Audit Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-box {
            background: white;
            padding: 35px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .submit-button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            visibility: hidden;
        }

        .helper {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="form-box">

        <h2>Create Account</h2>

        <p class="helper">Enter your details to continue</p>

        <input type="text" placeholder="Full Name">

        <input type="email" placeholder="Email Address">

        <input type="password" placeholder="Password">

        <button class="submit-button">
            Submit
        </button>

    </div>

</body>
</html>
