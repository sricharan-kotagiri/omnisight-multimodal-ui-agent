<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative OmniSight demo screenshot</title>
  <desc id="desc">A sample online store cart with a checkout button highlighted.</desc>
  <rect width="1440" height="900" fill="#eef2f7"/><rect width="1440" height="58" fill="#d9e1eb"/>
  <circle cx="28" cy="29" r="8" fill="#fb7185"/><circle cx="55" cy="29" r="8" fill="#fbbf24"/><circle cx="82" cy="29" r="8" fill="#34d399"/>
  <rect x="205" y="14" width="1030" height="30" rx="15" fill="#fff"/><text x="236" y="35" fill="#64748b" font-family="Arial,sans-serif" font-size="14">https://shop.example.test/cart</text>
  <rect x="90" y="110" width="1260" height="690" rx="18" fill="#fff"/>
  <text x="145" y="180" fill="#0f172a" font-family="Arial,sans-serif" font-size="36" font-weight="700">Demo Store</text><text x="145" y="218" fill="#64748b" font-family="Arial,sans-serif" font-size="18">Your shopping cart</text>
  <line x1="145" y1="255" x2="1295" y2="255" stroke="#e2e8f0" stroke-width="2"/><rect x="145" y="295" width="130" height="130" rx="12" fill="#e0f2fe"/><rect x="180" y="325" width="60" height="70" rx="8" fill="#38bdf8"/>
  <text x="310" y="335" fill="#0f172a" font-family="Arial,sans-serif" font-size="21" font-weight="700">Everyday Backpack</text><text x="310" y="372" fill="#64748b" font-family="Arial,sans-serif" font-size="16">Quantity: 1</text><text x="310" y="412" fill="#0f172a" font-family="Arial,sans-serif" font-size="18">$48.00</text>
  <line x1="145" y1="470" x2="1295" y2="470" stroke="#e2e8f0" stroke-width="2"/><text x="930" y="540" fill="#64748b" font-family="Arial,sans-serif" font-size="18">Subtotal</text><text x="1235" y="540" text-anchor="end" fill="#0f172a" font-family="Arial,sans-serif" font-size="18">$48.00</text>
  <text x="930" y="590" fill="#64748b" font-family="Arial,sans-serif" font-size="18">Shipping</text><text x="1235" y="590" text-anchor="end" fill="#0f172a" font-family="Arial,sans-serif" font-size="18">$5.00</text><line x1="930" y1="620" x2="1235" y2="620" stroke="#cbd5e1" stroke-width="2"/>
  <text x="930" y="665" fill="#0f172a" font-family="Arial,sans-serif" font-size="20" font-weight="700">Total</text><text x="1235" y="665" text-anchor="end" fill="#0f172a" font-family="Arial,sans-serif" font-size="20" font-weight="700">$53.00</text>
  <rect x="930" y="700" width="305" height="62" rx="12" fill="#087e8b"/><text x="1082" y="740" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Checkout</text><rect x="910" y="680" width="345" height="100" rx="18" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 8"/>
  <rect x="1040" y="780" width="165" height="32" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="1122" y="802" text-anchor="middle" fill="#9a3412" font-family="Arial,sans-serif" font-size="13" font-weight="700">DEMO SCREENSHOT</text>
